<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-labelledby="t d">
  <title id="t">RTU program parser flow</title>
  <desc id="d">Four steps: your input, scrape nodarbibas.rtu.lv with Selenium, filter lectures that clash with your schedule, write an Excel file.</desc>
  <style>
    .b{fill:#f4f6fa;stroke:#3b5b92;stroke-width:2}
    .t{font:600 15px sans-serif;fill:#1b2a41}
    .s{font:13px sans-serif;fill:#4a5568}
    .a{stroke:#3b5b92;stroke-width:2;fill:none}
  </style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b5b92"/></marker></defs>
  <rect class="b" x="10" y="40" width="190" height="110" rx="10"/>
  <text class="t" x="105" y="80" text-anchor="middle">1. Your input</text>
  <text class="s" x="105" y="104" text-anchor="middle">program, course, group</text>
  <text class="s" x="105" y="122" text-anchor="middle">date range</text>
  <rect class="b" x="250" y="40" width="190" height="110" rx="10"/>
  <text class="t" x="345" y="80" text-anchor="middle">2. Scrape</text>
  <text class="s" x="345" y="104" text-anchor="middle">Selenium opens</text>
  <text class="s" x="345" y="122" text-anchor="middle">nodarbibas.rtu.lv</text>
  <rect class="b" x="490" y="40" width="190" height="110" rx="10"/>
  <text class="t" x="585" y="80" text-anchor="middle">3. Filter</text>
  <text class="s" x="585" y="104" text-anchor="middle">drop time clashes with</text>
  <text class="s" x="585" y="122" text-anchor="middle">your main schedule</text>
  <rect class="b" x="730" y="40" width="160" height="110" rx="10"/>
  <text class="t" x="810" y="80" text-anchor="middle">4. Excel</text>
  <text class="s" x="810" y="104" text-anchor="middle">result.xlsx</text>
  <text class="s" x="810" y="122" text-anchor="middle">one row per lecture</text>
  <path class="a" d="M200 95H248" marker-end="url(#h)"/>
  <path class="a" d="M440 95H488" marker-end="url(#h)"/>
  <path class="a" d="M680 95H728" marker-end="url(#h)"/>
</svg>
